<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasteland Trees - Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .button {
            padding: 10px 16px;
            background: var(--anthropic-dark);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Poppins', sans-serif;
        }

        .button:hover {
            background: #2a2a27;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(20, 20, 19, 0.2);
        }

        .button:active {
            transform: translateY(0);
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 600px;
        }

        #canvas-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow: hidden;
            position: relative;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar with Controls -->
        <div class="sidebar">
            <h1>Wasteland Trees</h1>
            <p class="subtitle">Desolate Arborescence: Algorithmic dead trees for post-apocalyptic environments</p>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="text" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button" onclick="previousSeed()">← Prev</button>
                    <button class="button" onclick="nextSeed()">Next →</button>
                </div>
                <div class="button-row">
                    <button class="button" onclick="randomSeedAndUpdate()">Random</button>
                </div>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Tree Structure</h3>
                
                <!-- Tree Height -->
                <div class="control-group">
                    <label>Tree Height</label>
                    <div class="slider-container">
                        <input type="range" id="treeHeight" min="200" max="600" step="20" value="400" oninput="updateParam('treeHeight', this.value)">
                        <span class="value-display" id="treeHeight-value">400</span>
                    </div>
                </div>

                <!-- Branch Density -->
                <div class="control-group">
                    <label>Branch Density</label>
                    <div class="slider-container">
                        <input type="range" id="branchDensity" min="2" max="8" step="1" value="4" oninput="updateParam('branchDensity', this.value)">
                        <span class="value-display" id="branchDensity-value">4</span>
                    </div>
                </div>

                <!-- Asymmetry -->
                <div class="control-group">
                    <label>Asymmetry</label>
                    <div class="slider-container">
                        <input type="range" id="asymmetry" min="0" max="1" step="0.1" value="0.5" oninput="updateParam('asymmetry', this.value)">
                        <span class="value-display" id="asymmetry-value">0.5</span>
                    </div>
                </div>

                <!-- Branch Angle Chaos -->
                <div class="control-group">
                    <label>Branch Angle Chaos</label>
                    <div class="slider-container">
                        <input type="range" id="angleChaos" min="0.1" max="1.0" step="0.1" value="0.4" oninput="updateParam('angleChaos', this.value)">
                        <span class="value-display" id="angleChaos-value">0.4</span>
                    </div>
                </div>

                <!-- Thickness Taper -->
                <div class="control-group">
                    <label>Thickness Taper</label>
                    <div class="slider-container">
                        <input type="range" id="thicknessTaper" min="0.5" max="0.85" step="0.05" value="0.7" oninput="updateParam('thicknessTaper', this.value)">
                        <span class="value-display" id="thicknessTaper-value">0.7</span>
                    </div>
                </div>

                <!-- Branch Death Rate -->
                <div class="control-group">
                    <label>Branch Death Rate</label>
                    <div class="slider-container">
                        <input type="range" id="deathRate" min="0" max="0.5" step="0.05" value="0.2" oninput="updateParam('deathRate', this.value)">
                        <span class="value-display" id="deathRate-value">0.2</span>
                    </div>
                </div>

                <!-- Trunk Lean -->
                <div class="control-group">
                    <label>Trunk Lean</label>
                    <div class="slider-container">
                        <input type="range" id="trunkLean" min="-0.3" max="0.3" step="0.05" value="0" oninput="updateParam('trunkLean', this.value)">
                        <span class="value-display" id="trunkLean-value">0</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button" onclick="saveTree()">Download PNG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Growing dead trees...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE ART PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            treeHeight: 400,
            branchDensity: 4,
            asymmetry: 0.5,
            angleChaos: 0.4,
            thicknessTaper: 0.7,
            deathRate: 0.2,
            trunkLean: 0
        };

        let defaultParams = {...params};

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS WASTELAND TREE ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        function setup() {
            let canvas = createCanvas(800, 800);
            canvas.parent('canvas-container');
            
            initializeSystem();
            
            // Remove loading message
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            
            background(250, 249, 245);
            
            // Draw the tree
            drawTree();
        }

        function drawTree() {
            // Starting position at bottom center
            let startX = width / 2;
            let startY = height - 50;
            
            // Initial trunk angle (negative = up, with lean)
            let initialAngle = -HALF_PI + params.trunkLean;
            
            // Initial trunk length (base of height)
            let initialLength = params.treeHeight * 0.3;
            
            // Initial thickness
            let initialThickness = params.treeHeight * 0.08;
            
            // Start recursive branching
            push();
            translate(startX, startY);
            
            // Draw trunk base with slight taper
            strokeWeight(initialThickness);
            stroke(20, 20, 19);
            noFill();
            
            // Recursive branch drawing
            branch(0, 0, initialAngle, initialLength, initialThickness, 0);
            pop();
        }

        function branch(x, y, angle, length, thickness, depth) {
            // Maximum recursion depth based on branch density
            let maxDepth = 6 + params.branchDensity;
            
            // Random early termination (death)
            if (depth > 2 && random(1) < params.deathRate * (depth / maxDepth)) {
                return;
            }
            
            // Stop if too deep or too thin
            if (depth > maxDepth || thickness < 1) {
                return;
            }
            
            // Calculate end point
            let endX = x + cos(angle) * length;
            let endY = y + sin(angle) * length;
            
            // Draw the branch with taper
            strokeWeight(thickness);
            stroke(20, 20, 19);
            line(x, y, endX, endY);
            
            // Add some texture/cracks randomly
            if (depth < 3 && random(1) < 0.3) {
                strokeWeight(thickness * 0.1);
                let crackLen = length * 0.2;
                let crackAngle = angle + random(-PI/4, PI/4);
                let crackX = x + cos(angle) * length * random(0.2, 0.8);
                let crackY = y + sin(angle) * length * random(0.2, 0.8);
                line(crackX, crackY, 
                     crackX + cos(crackAngle) * crackLen,
                     crackY + sin(crackAngle) * crackLen);
            }
            
            // Calculate number of child branches
            let numBranches = floor(random(1, 3));
            
            // Less branches as we go higher
            if (depth > maxDepth * 0.6) {
                numBranches = random(1) < 0.6 ? 1 : 2;
            }
            
            // Create child branches
            for (let i = 0; i < numBranches; i++) {
                // Branch split point (not always at end)
                let splitPoint = random(0.5, 1.0);
                let splitX = x + cos(angle) * length * splitPoint;
                let splitY = y + sin(angle) * length * splitPoint;
                
                // Base angle variation
                let baseAngleVariation = PI / 4;
                
                // Add asymmetry - favor one side
                let asymmetryBias = (random(1) < params.asymmetry) ? 
                    random(0.5, 1.5) : random(-0.5, 0.5);
                
                // Calculate child angle with chaos
                let angleVariation = baseAngleVariation * (1 + params.angleChaos);
                let childAngle = angle + 
                    random(-angleVariation, angleVariation) + 
                    asymmetryBias * 0.3;
                
                // Length reduction (branches get shorter)
                let lengthReduction = random(0.6, 0.8);
                let childLength = length * lengthReduction;
                
                // Thickness reduction
                let childThickness = thickness * params.thicknessTaper;
                
                // Recurse
                branch(splitX, splitY, childAngle, childLength, childThickness, depth + 1);
            }
        }

        function draw() {
            // Static image - no animation needed
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            initializeSystem();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};
            
            // Update all UI elements
            document.getElementById('treeHeight').value = params.treeHeight;
            document.getElementById('treeHeight-value').textContent = params.treeHeight;
            document.getElementById('branchDensity').value = params.branchDensity;
            document.getElementById('branchDensity-value').textContent = params.branchDensity;
            document.getElementById('asymmetry').value = params.asymmetry;
            document.getElementById('asymmetry-value').textContent = params.asymmetry;
            document.getElementById('angleChaos').value = params.angleChaos;
            document.getElementById('angleChaos-value').textContent = params.angleChaos;
            document.getElementById('thicknessTaper').value = params.thicknessTaper;
            document.getElementById('thicknessTaper-value').textContent = params.thicknessTaper;
            document.getElementById('deathRate').value = params.deathRate;
            document.getElementById('deathRate-value').textContent = params.deathRate;
            document.getElementById('trunkLean').value = params.trunkLean;
            document.getElementById('trunkLean-value').textContent = params.trunkLean;
            
            updateSeedDisplay();
            initializeSystem();
        }

        function saveTree() {
            saveCanvas('wasteland_tree_' + params.seed, 'png');
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>

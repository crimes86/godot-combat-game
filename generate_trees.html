<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Wasteland Trees</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #2a2a2a;
            color: white;
            padding: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .tree-canvas {
            background: white;
            border-radius: 8px;
            padding: 10px;
        }
        h2 {
            text-align: center;
            margin: 10px 0;
        }
        .instructions {
            width: 100%;
            background: #3a3a3a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        button {
            background: #d97757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #c86641;
        }
    </style>
</head>
<body>
    <div class="instructions">
        <h2>Wasteland Tree Generator</h2>
        <p>Three high-fidelity dead tree sprites will be generated automatically.</p>
        <p>Right-click each canvas and "Save Image As..." to download, or use the download buttons.</p>
    </div>

    <script>
        // Tree configurations for variety - 10 unique trees
        const treeConfigs = [
            {
                name: "dead_tree_1",
                seed: 77777,
                treeHeight: 100,
                branchDensity: 5,
                asymmetry: 0.6,
                angleChaos: 0.5,
                thicknessTaper: 0.7,
                deathRate: 0.25,
                trunkLean: -0.15
            },
            {
                name: "dead_tree_2",
                seed: 88888,
                treeHeight: 110,
                branchDensity: 4,
                asymmetry: 0.3,
                angleChaos: 0.3,
                thicknessTaper: 0.75,
                deathRate: 0.15,
                trunkLean: 0.1
            },
            {
                name: "dead_tree_3",
                seed: 99999,
                treeHeight: 105,
                branchDensity: 6,
                asymmetry: 0.7,
                angleChaos: 0.6,
                thicknessTaper: 0.65,
                deathRate: 0.3,
                trunkLean: 0.05
            },
            {
                name: "dead_tree_4",
                seed: 12345,
                treeHeight: 95,
                branchDensity: 3,
                asymmetry: 0.4,
                angleChaos: 0.4,
                thicknessTaper: 0.72,
                deathRate: 0.35,
                trunkLean: 0.2
            },
            {
                name: "dead_tree_5",
                seed: 54321,
                treeHeight: 115,
                branchDensity: 7,
                asymmetry: 0.8,
                angleChaos: 0.7,
                thicknessTaper: 0.68,
                deathRate: 0.2,
                trunkLean: -0.1
            },
            {
                name: "dead_tree_6",
                seed: 11111,
                treeHeight: 90,
                branchDensity: 5,
                asymmetry: 0.2,
                angleChaos: 0.25,
                thicknessTaper: 0.78,
                deathRate: 0.4,
                trunkLean: 0
            },
            {
                name: "dead_tree_7",
                seed: 22222,
                treeHeight: 108,
                branchDensity: 6,
                asymmetry: 0.65,
                angleChaos: 0.55,
                thicknessTaper: 0.7,
                deathRate: 0.18,
                trunkLean: -0.2
            },
            {
                name: "dead_tree_8",
                seed: 33333,
                treeHeight: 98,
                branchDensity: 4,
                asymmetry: 0.5,
                angleChaos: 0.45,
                thicknessTaper: 0.73,
                deathRate: 0.28,
                trunkLean: 0.15
            },
            {
                name: "dead_tree_9",
                seed: 44444,
                treeHeight: 112,
                branchDensity: 5,
                asymmetry: 0.75,
                angleChaos: 0.65,
                thicknessTaper: 0.67,
                deathRate: 0.22,
                trunkLean: -0.05
            },
            {
                name: "dead_tree_10",
                seed: 55555,
                treeHeight: 102,
                branchDensity: 3,
                asymmetry: 0.35,
                angleChaos: 0.35,
                thicknessTaper: 0.76,
                deathRate: 0.32,
                trunkLean: 0.08
            }
        ];

        let currentTree = 0;
        let canvases = [];

        function setup() {
            noLoop();

            // Create a canvas for each tree
            for (let i = 0; i < treeConfigs.length; i++) {
                let container = createDiv('');
                container.class('tree-canvas');
                container.parent(document.body);

                let title = createDiv(`<h2>${treeConfigs[i].name}</h2>`);
                title.parent(container);

                let canvas = createGraphics(128, 128);
                canvases.push({canvas: canvas, config: treeConfigs[i], container: container});

                // Generate the tree
                generateTree(canvas, treeConfigs[i]);

                // Create image element to display
                let img = createImg(canvas.canvas.toDataURL());
                img.parent(container);
                img.style('display', 'block');
                img.style('margin', '10px auto');

                // Add download button
                let btn = createButton(`Download ${treeConfigs[i].name}.png`);
                btn.parent(container);
                btn.mousePressed(() => downloadTree(canvas, treeConfigs[i].name));
            }
        }

        function generateTree(pg, config) {
            pg.randomSeed(config.seed);
            pg.noiseSeed(config.seed);

            // Transparent background
            pg.clear();

            // Starting position at bottom center
            let startX = pg.width / 2;
            let startY = pg.height - 8;

            // Initial trunk angle (negative = up, with lean)
            let initialAngle = -HALF_PI + config.trunkLean;

            // Initial trunk length (base of height)
            let initialLength = config.treeHeight * 0.3;

            // Initial thickness
            let initialThickness = config.treeHeight * 0.08;

            // Start recursive branching
            pg.push();
            pg.translate(startX, startY);

            // Draw trunk and branches
            drawBranch(pg, config, 0, 0, initialAngle, initialLength, initialThickness, 0);
            pg.pop();
        }

        function drawBranch(pg, config, x, y, angle, length, thickness, depth) {
            // Maximum recursion depth based on branch density
            let maxDepth = 6 + config.branchDensity;

            // Random early termination (death)
            if (depth > 2 && pg.random(1) < config.deathRate * (depth / maxDepth)) {
                // Draw broken branch end
                if (thickness > 2) {
                    for (let i = 0; i < 3; i++) {
                        let jagX = x + pg.random(-2, 2);
                        let jagY = y + pg.random(-2, 2);
                        pg.strokeWeight(1);
                        pg.stroke(20, 20, 19);
                        pg.line(x, y, jagX, jagY);
                    }
                }
                return;
            }

            // Stop if too deep or too thin
            if (depth > maxDepth || thickness < 0.8) {
                return;
            }

            // Calculate end point
            let endX = x + cos(angle) * length;
            let endY = y + sin(angle) * length;

            // Draw the branch with taper and texture
            for (let i = 0; i <= length; i += 2) {
                let t = i / length;
                let currX = x + cos(angle) * i;
                let currY = y + sin(angle) * i;
                let currThickness = thickness * (1 - t * 0.2);

                // Add texture variation
                let colorVar = pg.random(0, 20);
                pg.stroke(20 + colorVar, 20 + colorVar, 19 + colorVar);
                pg.strokeWeight(currThickness);
                pg.point(currX, currY);
            }

            // Add bark texture cracks on trunk
            if (depth < 3 && pg.random(1) < 0.4) {
                pg.strokeWeight(thickness * 0.15);
                pg.stroke(10, 10, 9);
                let crackLen = length * 0.15;
                let crackAngle = angle + pg.random(-PI/6, PI/6);
                let crackX = x + cos(angle) * length * pg.random(0.3, 0.7);
                let crackY = y + sin(angle) * length * pg.random(0.3, 0.7);
                pg.line(crackX, crackY,
                     crackX + cos(crackAngle) * crackLen,
                     crackY + sin(crackAngle) * crackLen);
            }

            // Calculate number of child branches
            let numBranches = floor(pg.random(1, 3));

            // Less branches as we go higher
            if (depth > maxDepth * 0.6) {
                numBranches = pg.random(1) < 0.6 ? 1 : 2;
            }

            // Create child branches
            for (let i = 0; i < numBranches; i++) {
                // Branch split point (not always at end)
                let splitPoint = pg.random(0.5, 1.0);
                let splitX = x + cos(angle) * length * splitPoint;
                let splitY = y + sin(angle) * length * splitPoint;

                // Base angle variation
                let baseAngleVariation = PI / 4;

                // Add asymmetry - favor one side
                let asymmetryBias = (pg.random(1) < config.asymmetry) ?
                    pg.random(0.5, 1.5) : pg.random(-0.5, 0.5);

                // Calculate child angle with chaos
                let angleVariation = baseAngleVariation * (1 + config.angleChaos);
                let childAngle = angle +
                    pg.random(-angleVariation, angleVariation) +
                    asymmetryBias * 0.3;

                // Length reduction (branches get shorter)
                let lengthReduction = pg.random(0.6, 0.8);
                let childLength = length * lengthReduction;

                // Thickness reduction
                let childThickness = thickness * config.thicknessTaper;

                // Recurse
                drawBranch(pg, config, splitX, splitY, childAngle, childLength, childThickness, depth + 1);
            }
        }

        function downloadTree(canvas, name) {
            saveCanvas(canvas, name, 'png');
        }
    </script>
</body>
</html>

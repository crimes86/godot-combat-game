<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Authentication Successful - Ashbane</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/ashbane-theme.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #121214;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Roboto Mono', monospace;
      color: #e0e0e0;
    }

    .success-wrapper {
      text-align: center;
      padding: 2.5rem;
      background: rgba(20, 20, 22, 0.95);
      border: 1px solid rgba(90, 90, 90, 0.5);
      border-radius: 16px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 4px 0 rgba(0,0,0,0.3),
        0 8px 20px rgba(0,0,0,0.4);
      max-width: 420px;
      margin: 20px;
    }

    /* Ashbane Logo Header */
    .logo-header {
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 0 6px #ff6a00) drop-shadow(0 0 12px #ff4500);
    }

    .logo-text {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #fff;
      text-shadow:
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #ff6a00,
        0 0 40px #ff4500;
    }

    .checkmark {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6a00 0%, #ff4500 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 0 25px rgba(255, 106, 0, 0.4);
    }

    .checkmark svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 106, 0, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 106, 0, 0.6); }
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ff6a00;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 10px rgba(255, 106, 0, 0.4);
    }

    .provider {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 1rem;
      text-transform: capitalize;
    }

    .message {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .message strong {
      color: #ff6a00;
    }

    .close-hint {
      font-size: 0.75rem;
      color: #666;
      padding: 0.75rem;
      background: rgba(255, 106, 0, 0.08);
      border: 1px solid rgba(255, 106, 0, 0.2);
      border-radius: 6px;
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.65rem;
      color: #555;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="success-wrapper">
    <!-- Ashbane Logo Header -->
    <div class="logo-header">
      <img src="/static/logo/ashbane-icon-256.png" alt="" class="logo-icon" />
      <span class="logo-text">Ashbane</span>
      <img src="/static/logo/ashbane-icon-256.png" alt="" class="logo-icon" />
    </div>

    <div class="checkmark">
      <svg viewBox="0 0 24 24">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
      </svg>
    </div>
    <h1>Authentication Successful</h1>
    <p class="provider">Connected via {{ provider }}</p>
    <p class="message">
      You're now signed in as <strong>{{ username }}</strong>.
      <br>You can return to the game.
    </p>
    <p class="close-hint">You may close this window.</p>
    <div class="footer">&copy; 2025 Ashbane</div>
  </div>
</body>
</html>

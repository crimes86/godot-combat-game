<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Ashbane Icon - M-shelf with trophy + stand -->
  <defs>
    <style>
      .stroke {
        fill: none;
        stroke: #00CCE6;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .handle {
        fill: none;
        stroke: #00CCE6;
        stroke-width: 1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .stand {
        fill: none;
        stroke: #007A8A;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.7;
      }
    </style>
  </defs>

  <!-- M-Ashbane shape: two pillars with shelf in middle -->
  <polyline class="stroke" points="4,20 4,10 8,10 8,14 16,14 16,10 20,10 20,20" />

  <!-- Trophy stand - extends down through M -->
  <line class="stand" x1="12" y1="9" x2="12" y2="20" />

  <!-- Trophy base -->
  <line class="stroke" x1="10" y1="9" x2="14" y2="9" />

  <!-- Trophy stem -->
  <line class="stroke" x1="12" y1="9" x2="12" y2="7" />

  <!-- Trophy cup left side -->
  <line class="stroke" x1="11" y1="7" x2="9" y2="3" />

  <!-- Trophy cup right side -->
  <line class="stroke" x1="13" y1="7" x2="15" y2="3" />

  <!-- Trophy rim -->
  <line class="stroke" x1="9" y1="3" x2="15" y2="3" />

  <!-- Left handle -->
  <polyline class="handle" points="9,4 8,5 9,6" />

  <!-- Right handle -->
  <polyline class="handle" points="15,4 16,5 15,6" />
</svg>

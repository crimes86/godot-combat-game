<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 48" width="60" height="48">
  <defs>
    <style>
      .Ashbane-stroke {
        fill: none;
        stroke: #00CCE6;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .trophy-stroke {
        fill: none;
        stroke: #00CCE6;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .handle-stroke {
        fill: none;
        stroke: #00CCE6;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .stand-stroke {
        fill: none;
        stroke: #007A8A;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.7;
      }

      /* Animation keyframes */
      @keyframes Ashbane-fade-in {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      @keyframes trophy-drop {
        0% {
          opacity: 0;
          transform: translateY(-3px);
        }
        60% {
          opacity: 1;
          transform: translateY(1px);
        }
        80% {
          transform: translateY(-0.5px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes glow-pulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.3); }
      }

      /* Apply animations */
      #Ashbane-shape {
        opacity: 0;
        animation: Ashbane-fade-in 0.4s ease-out 0.3s forwards;
      }

      #trophy-group {
        opacity: 0;
        animation: trophy-drop 0.3s ease-out 0.7s forwards;
      }

      #logo-container {
        animation: glow-pulse 0.35s ease-in-out 1.1s;
      }
    </style>
  </defs>

  <g id="logo-container">
    <!-- M-Ashbane shape: two pillars with shelf/dip in middle -->
    <polyline id="Ashbane-shape" class="Ashbane-stroke"
      points="9,45.6 9,24 21.6,24 21.6,34 38.4,34 38.4,24 51,24 51,45.6" />

    <!-- Trophy group -->
    <g id="trophy-group">
      <!-- Trophy stand - extends down through M to complete the letter (duller) -->
      <line class="stand-stroke" x1="30" y1="22" x2="30" y2="45.6" />

      <!-- Trophy base -->
      <line class="trophy-stroke" x1="25.8" y1="22" x2="34.2" y2="22" />

      <!-- Trophy stem (up into cup) -->
      <line class="trophy-stroke" x1="30" y1="22" x2="30" y2="17" />

      <!-- Trophy cup left side -->
      <line class="trophy-stroke" x1="28" y1="17" x2="22.4" y2="3.8" />

      <!-- Trophy cup right side -->
      <line class="trophy-stroke" x1="32" y1="17" x2="37.6" y2="3.8" />

      <!-- Trophy rim -->
      <line class="trophy-stroke" x1="22.4" y1="3.8" x2="37.6" y2="3.8" />

      <!-- Left handle -->
      <polyline class="handle-stroke" points="22.4,5.8 20.3,8.8 22.4,11.8" />

      <!-- Right handle -->
      <polyline class="handle-stroke" points="37.6,5.8 39.7,8.8 37.6,11.8" />
    </g>
  </g>
</svg>

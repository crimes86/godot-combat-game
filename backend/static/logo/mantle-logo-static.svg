<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 48" width="60" height="48">
  <defs>
    <style>
      .stroke {
        fill: none;
        stroke: #00CCE6;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .handle {
        fill: none;
        stroke: #00CCE6;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .stand {
        fill: none;
        stroke: #007A8A;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.7;
      }
    </style>
  </defs>

  <!-- M-Mantle shape: two pillars with shelf/dip in middle -->
  <polyline class="stroke" points="9,45.6 9,24 21.6,24 21.6,34 38.4,34 38.4,24 51,24 51,45.6" />

  <!-- Trophy stand - extends down through M to complete the letter (duller) -->
  <line class="stand" x1="30" y1="22" x2="30" y2="45.6" />

  <!-- Trophy base -->
  <line class="stroke" x1="25.8" y1="22" x2="34.2" y2="22" />

  <!-- Trophy stem (up into cup) -->
  <line class="stroke" x1="30" y1="22" x2="30" y2="17" />

  <!-- Trophy cup left side -->
  <line class="stroke" x1="28" y1="17" x2="22.4" y2="3.8" />

  <!-- Trophy cup right side -->
  <line class="stroke" x1="32" y1="17" x2="37.6" y2="3.8" />

  <!-- Trophy rim -->
  <line class="stroke" x1="22.4" y1="3.8" x2="37.6" y2="3.8" />

  <!-- Left handle -->
  <polyline class="handle" points="22.4,5.8 20.3,8.8 22.4,11.8" />

  <!-- Right handle -->
  <polyline class="handle" points="37.6,5.8 39.7,8.8 37.6,11.8" />
</svg>
